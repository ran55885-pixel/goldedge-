[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurum-nexus"
version = "1.0.0"
description = "Aurum Nexus - multi-agent, multi-account MT5 day-trading system for gold and forex (paper by default)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - personal use" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "python-dotenv>=1.0",
  "qrcode>=7.4",
  "pillow>=10.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
windows = ["MetaTrader5>=5.0.45", "pywebview>=5.0", "pystray>=0.19", "pyinstaller>=6.5"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
mt5sys = "aurum_nexus.cli:main"
aurum-nexus = "aurum_nexus.cli:main"

[tool.setuptools.packages.find]
include = ["aurum_nexus*"]

[tool.setuptools.package-data]
aurum_nexus = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
