# ===== MemeScan configuration =====
chains: [solana, base]        # which chains to scan
interval_seconds: 60          # how often to run a scan cycle

# --- Hard filters: a token that fails any of these is skipped ---
filters:
  min_liquidity_usd: 15000    # thin pools are easy to rug and impossible to exit
  min_fdv_usd: 20000
  max_fdv_usd: 5000000        # above this, room for x10-x100 is small
  min_age_minutes: 10         # let the first sniper wave settle
  max_age_hours: 48
  min_volume_h1_usd: 20000
  min_txns_h1: 150
  min_buy_ratio_h1: 0.52      # share of buys out of all h1 transactions
  min_price_change_h1: 5      # must be going UP in the last hour
  min_price_change_m5: -10    # and not dumping right now
  max_price_change_h1: 800    # already up 8x in an hour = chasing the top

# --- Safety (anti-rug) ---
safety:
  solana_max_rugcheck_score: 40   # RugCheck normalised score; lower is safer
  solana_block_danger_risks: true # any "danger" risk from RugCheck = skip
  base_max_tax_pct: 10            # buy/sell tax on Base
  fail_if_unknown: true           # no safety data yet = skip

# --- Scoring: 0-100. Entry only at or above this score ---
entry_min_score: 65

# --- Paper trading (simulated, no real money) ---
paper:
  enabled: true
  starting_balance_usd: 1000
  position_size_usd: 25
  max_open_positions: 8
  max_entries_per_day: 15
  slippage_pct: 4             # simulated cost on entry and exit
  stop_loss_pct: 30           # exit everything at -30%
  take_profit_pct: 100        # at +100% (2x) sell part of the position
  take_profit_sell_fraction: 0.5   # ...this share; the rest rides for free
  trailing_stop_pct: 35       # after the TP, exit the rest if it falls 35% from its peak
  max_hold_hours: 12
  rug_liquidity_drop_pct: 60  # liquidity fell 60%+ from entry = treat as rug, exit

# --- Telegram alerts (optional). Set these as environment variables instead of here:
#     MEMESCAN_TG_TOKEN and MEMESCAN_TG_CHAT_ID
telegram:
  enabled: false

# ===== LAUNCH MODE: brand-new pump.fun coins, first minutes =====
# python -m memescan launch
launch:
  watch_minutes: 20           # follow every new coin for this long after launch
  poll_seconds: 8             # how often to refresh stats of watched coins
  min_age_seconds: 180        # live test: entries at ~1 min got dumped -86% by snipers. Wait 3 min.
  confirm_polls: 2            # setup must hold on 2 polls in a row (no single-spike entries)
  buzz_window_minutes: 60     # if `intel` is running: contract mentioned by independent sources...
  buzz_bonus_per_source: 4    # ...adds this many points per source (max 3 sources)
  max_dev_buy_pct: 8          # dev bought more than 8% of supply at launch = dump risk
  min_mcap_multiple: 2.5      # market cap now vs at launch (x2.5 = +150%)
  min_mcap_usd: 7000
  max_mcap_usd: 90000         # above this the early part of the move is gone
  min_buys_m5: 40
  min_buy_ratio_m5: 0.55
  min_volume_m5_usd: 4000
  min_price_change_m5: 10     # still climbing in the last 5 minutes
  entry_min_score: 60
  require_rugcheck: true
  # Only with a PumpPortal API key (env MEMESCAN_PUMPPORTAL_KEY), which gives the per-trade stream:
  min_unique_buyers: 30
  exit_if_dev_sells: true
  paper:
    starting_balance_usd: 1000
    position_size_usd: 20
    max_open_positions: 6
    max_entries_per_day: 25
    slippage_pct: 10          # first minutes are brutal: assume 10% each way
    stop_loss_pct: 35
    take_profit_pct: 100
    take_profit_sell_fraction: 0.5
    trailing_stop_pct: 40
    max_hold_hours: 3
    rug_liquidity_drop_pct: 60

# ===== INTEL: news, exchange listings, communities =====
# python -m memescan intel            run forever (alerts + learning)
# python -m memescan intel --sources  reliability table per source
intel:
  min_independent_sources: 2  # alert when one contract is called by N independent sources...
  buzz_window_minutes: 60     # ...within this window
  sources:
    # Tier "exchange" (official, trust 1.0): new market on Binance/Coinbase/Upbit/Bithumb = the
    # single most reliable pump catalyst. Detected by diffing each exchange's market list.
    exchanges: {interval: 90}
    binance_announcements: {interval: 120}
    # Tier "news" (trust 0.85): established newsrooms with editors and corrections policies.
    news_rss:
      interval: 300
      feeds:
        CoinDesk: https://www.coindesk.com/arc/outboundfeeds/rss/
        Cointelegraph: https://cointelegraph.com/rss
        Decrypt: https://decrypt.co/feed
        TheBlock: https://www.theblock.co/rss.xml
        Blockworks: https://blockworks.co/feed
        DLNews: https://www.dlnews.com/arc/outboundfeeds/rss/
    # Tier "aggregator" (trust 0.6)
    coingecko_trending: {interval: 600}
    cryptopanic: {interval: 300}     # needs a free key: env MEMESCAN_CRYPTOPANIC_KEY
    # Tier "community" (trust 0.3): early but noisy and often manipulated. Never treated as fact;
    # each source earns or loses weight from the real price outcome of its calls.
    reddit:
      interval: 180
      subreddits: [solana, CryptoMoonShots, memecoins, SatoshiStreetBets]
    fourchan_biz: {interval: 180}
    telegram_public:
      interval: 180
      channels: [binance_announcements]   # add PUBLIC channel usernames here (the part after t.me/)
